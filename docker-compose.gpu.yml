services:
  # GPU-accelerated application
  app-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: author-switch-detector:gpu
    container_name: author-switch-gpu
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - PYTHONPATH=/app/src
      - DATA_DIR=/app/data
      - CACHE_DIR=/app/data/cache
      - CACHE_ENABLED=true
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python -m src.main --use-gpu

  # GPU Jupyter
  jupyter-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: author-switch-detector:gpu-jupyter
    container_name: author-switch-gpu-jupyter
    ports:
      - "8889:8888"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./notebooks:/app/notebooks
    environment:
      - PYTHONPATH=/app/src
      - DATA_DIR=/app/data
      - CACHE_ENABLED=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
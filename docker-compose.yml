version: "3.8"

x-app-base: &app-base
  build: .
  image: author-switch-detector:latest
  volumes:
    - ./src:/app/src
    - ./data:/app/data
    - ./dataset:/app/dataset
    - ./outputs:/app/outputs
  environment:
    - PYTHONPATH=/app/src
    - DATA_DIR=/app/data
  # Automatically maps your host machine's NVIDIA GPU if it is present
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # 1. Main Pipeline / Local Training Service
  app:
    <<: *app-base
    container_name: author-switch-detector
    # Bypasses run.sh to execute local training directly
    entrypoint: ["python", "-m", "src.main"]
    command: ["--mode", "train"]

  # 2. Interactive Notebook Workspace
  jupyter:
    <<: *app-base
    container_name: author-switch-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./notebooks:/app/notebooks
    environment:
      - PYTHONPATH=/app/src
      - DATA_DIR=/app/data
      - CACHE_ENABLED=true
    entrypoint: []
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''

  # 3. Code Verification / Local Testing Service
  test:
    <<: *app-base
    container_name: author-switch-test
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./tests:/app/tests
    environment:
      - PYTHONPATH=/app/src
      - DATA_DIR=/app/data
      - CACHE_ENABLED=false
    entrypoint: []
    command: pytest tests/ -v --tb=short

name: Upload Software to TIRA

on:
  workflow_dispatch:

jobs:
  tira-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install TIRA CLI
        run: |
          pip install --upgrade pip
          pip install tira

      - name: Login and Submit
        run: |
          tira-cli login --token ${{ secrets.TIRA_CLIENT_TOKEN }}
          tira-cli verify-installation
          tira-cli code-submission \
            --path . \
            --task multi-author-writing-style-analysis-2026 \
            --dataset multi-author-writing-style-analysis-2026/smoketest-20260330-training
